[package]
name = "ghostroom-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Loopback-only ephemeral room control plane (no messaging or E2EE)"

[dependencies]
ghostroom-core = { path = ".." }
axum = { version = "0.8", features = ["json", "http1", "tokio"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already present transitively in Cargo.lock; used directly to configure
# HTTP/1 parser/header limits and Tokio I/O without a custom parser.
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }
zeroize = "1"


[dev-dependencies]
http-body-util = "0.1"
